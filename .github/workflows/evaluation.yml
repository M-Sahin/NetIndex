name: Evaluation - Nightly RAG Quality

on:
  schedule:
    # 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Run Evaluation Tests
        run: dotnet test tests/NetIndex.Evaluation.Tests/NetIndex.Evaluation.Tests.csproj --no-build --configuration Release --logger trx --results-directory results --filter "Category=Evaluation"

      - name: Verify evaluation tests actually ran
        if: always()
        run: |
          shopt -s nullglob
          trx_files=(results/*.trx)
          if [ ${#trx_files[@]} -eq 0 ]; then
            echo "ERROR: no TRX result files were produced under results/"
            exit 1
          fi
          if ! grep -l '<UnitTestResult ' "${trx_files[@]}" >/dev/null; then
            echo "ERROR: TRX file(s) contain zero <UnitTestResult> entries — the Evaluation filter matched no tests."
            exit 1
          fi
          echo "Confirmed: at least one Evaluation-tagged test executed."

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: results/

      - name: Comment on results
        if: always()
        run: |
          echo "Evaluation results available in artifacts"
