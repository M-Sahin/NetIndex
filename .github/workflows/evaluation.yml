name: Evaluation - Nightly RAG Quality

on:
  schedule:
    # 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Run Evaluation Tests
        run: dotnet test --no-build --configuration Release --logger trx --results-directory results --filter "Category=Evaluation"
        env:
          # Evaluation may use external APIs for quality metrics
          EVALUATION_MODE: true

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: results/

      - name: Comment on results
        if: always()
        run: |
          echo "Evaluation results available in artifacts"
