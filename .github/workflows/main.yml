name: Main Gate - Contract + Integration

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netindex_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Run Contract Tests
        run: dotnet test --no-build --configuration Release --logger trx --results-directory results --filter "Category=ContractTest"

      - name: Run Integration Tests
        run: dotnet test --no-build --configuration Release --logger trx --results-directory results --filter "Category=Integration"
        env:
          POSTGRES_CONNECTION_STRING: "Host=localhost;Username=postgres;Password=postgres;Database=netindex_test"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/
